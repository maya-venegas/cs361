<!DOCTYPE html>
<head>
    <title>Home</title>
    
    <link rel="stylesheet" href="style.css" />
</head>

<body>
<header>
    <h1>Home Page</h1>
</header>


<nav>
    <a href="home.html">Home</a>
    <a href="index.html" target="_blank">Get started with the timer here!</a>
    <a href="settings.html" target="_blank">Settings Page</a>
    <a href="help.html" target="_blank">Help Page</a>
</nav>

<div>
    <p>Create and manage your to-do list!</p>
    <p>Try out a new method to balance work and rest!</p>
    <h2>To-Do List</h2>
    <div class="in-progress-section">
        <h3>In-Progress:</h3>
        <button id="in-progress" class="add-task-button">Add Task</button>
        <textarea id="new-task-title" placeholder="Add a new task here!"></textarea>
    </div>
    <!-- For later
    <div class="completed-section">
        <h3>Completed:</h3>
        <button id="completed" class="add-task-button">Add Task</button>
    </div>
    -->
</div>
<div id="blank-task-modal" class="modal">
    <div class="modal-content">
        <p>You're about to create a blank task. Continue?</p>
        <button id="cancel-modal">Cancel</button>
        <button id="continue-modal">Continue</button>
    </div>

</div>

    <script src="app.js"></script>
</body>
</html>
