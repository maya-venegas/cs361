<!DOCTYPE html>
<head>
    <title>Home</title>
    
    <link rel="stylesheet" href="style.css" />
</head>

<body>
<header>
    <h1>Tasks and Timers</h1>
</header>


<nav id="nav-bar">
    <span class="nav-item"><a href="home.html">Home</a></span>
    <span class="nav-item"><a href="index.html" target="_blank">Timer</a></span>
    <span class="nav-item"><a href="settings.html" target="_blank">Settings</a></span>
    <span class="nav-item"><a href="help.html" target="_blank">Help</a></span>
</nav>

<div id="pep-message-div">
    <p>Create and manage your to-do list!</p>
    <p>Try out a new method to balance work and rest!</p>
</div>
<div class="page-header-div">
    <h2>To-Do List</h2>
</div>
<div class="task-container">
    <div class="in-progress-section">
        <h3>Tasks:</h3>
        <button id="in-progress" class="add-task-button">Add Task</button>
        <textarea id="new-task-title" placeholder="Add a new task here!"></textarea>
    </div>
    <!--<div class="completed-section">
        <h3>Completed:</h3>
    </div>-->
</div>
<div class="page-header-div">
    <h2>Current Work Session</h2>
</div>

<div id="session-timer-box" class="session-box">
    <p><strong>Session Length:</strong> <span id="session-timer">00:00</span></p>
</div>

<div id="blank-task-modal" class="modal">
    <div class="modal-content">
        <p>You're about to create a blank task. Continue?</p>
        <button id="cancel-modal">Cancel</button>
        <button id="continue-modal">Continue</button>
    </div>

</div>

    <script src="app.js"></script>
</body>
</html>
